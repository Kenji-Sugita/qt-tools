      .base { fill: #ffffff; stroke: #cfd4dc; stroke-width: 1.5; }
      .legend { fill: #000000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 20px; font-weight: 650; text-anchor: middle; }
      .small { fill: #000000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; font-weight: 650; text-anchor: middle; }
      .tiny { fill: #000000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; font-weight: 650; text-anchor: middle; }
      .dual { fill: #000000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 15px; font-weight: 650; text-anchor: middle; }
    </style>
