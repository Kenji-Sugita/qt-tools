         dx="0"
         dy="8"
         stdDeviation="8"
         flood-color="#000000"
         flood-opacity="0.5" />
    </filter>
    <filter
       id="subtle_frame_texture"
       inkscape:label="subtle black frame texture"
       x="0"
       y="0"
       width="1"
       height="1">
      <feTurbulence
         type="fractalNoise"
         baseFrequency="0.55"
         numOctaves="3"
         seed="12"
         result="texture"
         id="feTurbulence15" />
      <feColorMatrix
         in="texture"
         type="saturate"
         values="0"
         result="gray_texture"
         id="feColorMatrix15" />
      <feBlend
         in="SourceGraphic"
         in2="gray_texture"
         mode="multiply"
         id="feBlend15" />
    </filter>
