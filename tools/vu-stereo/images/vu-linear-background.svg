  <title
     id="title">Needleless linear VU meter background</title>
  <desc
     id="desc">A transparent-background VU meter face with a black rectangular frame, yellow dial, straight linear scale, labels, plus marks, and VU text. No needle or pivot is drawn.</desc>
  <defs
     id="defs"
     inkscape:label="definitions">
    <linearGradient
       id="outer_frame_gradient"
       inkscape:label="outer frame black gradient"
       x1="0"
       y1="0"
       x2="0"
       y2="1">
      <stop
         offset="0"
         stop-color="#333431"
         id="stop1" />
      <stop
         offset="0.18"
         stop-color="#151614"
         id="stop2" />
      <stop
         offset="0.64"
         stop-color="#242622"
         id="stop3" />
      <stop
         offset="1"
         stop-color="#070807"
         id="stop4" />
    </linearGradient>
    <linearGradient
       id="recess_gradient"
       inkscape:label="inner recess black gradient"
       x1="0"
       y1="0"
       x2="0"
       y2="1">
      <stop
         offset="0"
         stop-color="#020202"
         id="stop5" />
      <stop
         offset="0.5"
         stop-color="#111006"
         id="stop6" />
      <stop
         offset="1"
         stop-color="#030303"
         id="stop7" />
    </linearGradient>
    <radialGradient
       id="dial_face_gradient"
       inkscape:label="yellow dial face gradient"
       cx="50%"
       cy="33%"
       r="78%">
      <stop
         offset="0"
         stop-color="#fff0a8"
         id="stop8" />
      <stop
         offset="0.45"
         stop-color="#ffd36a"
         id="stop9" />
      <stop
         offset="0.78"
         stop-color="#e7ad43"
         id="stop10" />
      <stop
         offset="1"
         stop-color="#b97920"
         id="stop11" />
    </radialGradient>
    <linearGradient
       id="dial_edge_gradient"
       inkscape:label="gold dial edge gradient"
       x1="0"
       y1="0"
       x2="0"
       y2="1">
      <stop
         offset="0"
         stop-color="#d99a28"
         id="stop12" />
      <stop
         offset="0.2"
         stop-color="#f4c55a"
         id="stop13" />
      <stop
         offset="0.78"
         stop-color="#86560e"
         id="stop14" />
      <stop
